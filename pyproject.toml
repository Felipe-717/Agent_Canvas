[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentcanvas"
version = "0.1.0"
description = "Automatizacion de datos y BI generativo mediante agentes de IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "aiosqlite>=0.20",
    "openai>=3.1,<4",
    "httpx>=0.27",
    # pandas / pyarrow / openpyxl los aporta conda (ver environment.yml),
    # se declaran aqui para que la instalacion con pip pura tambien funcione.
    "pandas>=2.2",
    "pyarrow>=17",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agentcanvas"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Las migraciones las escribe alembic: no tiene sentido pelearse con su formato.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
exclude = "^migrations/versions/"
# Las capas puras no negocian; la infraestructura tiene libs sin tipos.
[[tool.mypy.overrides]]
module = ["agentcanvas.infrastructure.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["pandas.*", "pyarrow.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
